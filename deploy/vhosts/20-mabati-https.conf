# Mabati (ruirufactorymabati.com) — port 443.
#
# INSTALL ONLY AFTER the certificate is on the volume. nginx will not start if
# fullchain.pem is missing or empty, and this proxy also fronts fibicommunity.org,
# visionmentors.org and draftbitlabs.tech.
#
# Upstreams and the port-80 block live in 10-mabati-http.conf.
#
# CERTIFICATE PATH — note the lineage is `mabati`, not the domain name.
# /etc/letsencrypt/live/ruirufactorymabati.com/ is NOT this certificate: it holds
# the hand-published Cloudflare Origin pair the previous tenant (infora billing)
# used on this domain, and it is deliberately left untouched so that stack can be
# restored on a subdomain without re-issuing anything. This site uses a real
# certbot lineage instead, issued and renewed by the FIBI certbot container:
#   certbot certonly --webroot -w /var/www/certbot --cert-name mabati \
#     -d ruirufactorymabati.com -d www.ruirufactorymabati.com
#
# Inherited from the FIBI http block, deliberately not repeated here:
#   proxy_set_header Host / X-Real-IP / X-Forwarded-For / X-Forwarded-Proto
#   resolver, gzip, client_max_body_size, the rate-limit zones
#
# X-Forwarded-For is OVERWRITTEN there rather than appended, so the origin sees
# exactly one trusted address even behind Cloudflare.

# www -> apex, so the site has a single origin.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.ruirufactorymabati.com;

    ssl_certificate     /etc/letsencrypt/live/mabati/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mabati/privkey.pem;
    include /etc/nginx/conf.d/ssl-params.conf;

    return 301 https://ruirufactorymabati.com$request_uri;
}

# ------------------------------ Public site ------------------------------- #
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ruirufactorymabati.com;

    ssl_certificate     /etc/letsencrypt/live/mabati/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mabati/privkey.pem;
    include /etc/nginx/conf.d/ssl-params.conf;

    # No includeSubDomains: this certificate covers the apex and www only, and
    # the subdomains of this zone are free to be pointed elsewhere. Asserting
    # HSTS for them would force HTTPS on hosts that have no certificate here.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    limit_conn conn_limit 50;

    # A static single-page app: no API, no uploads, one upstream. Cache headers
    # are set by the origin container (nginx/default.conf) so that the immutable
    # /assets/ TTL and the no-cache on index.html stay in one place.
    location / {
        proxy_pass http://mabati_web;
    }
}
