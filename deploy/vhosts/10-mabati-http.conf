# Mabati (ruirufactorymabati.com) — port 80.
#
# Included into the FIBI edge proxy's http block; this directory is bind mounted
# into fibi-proxy-1 read-only as /etc/nginx/conf.d/vhosts-mabati.
#
# FIBI already defines a port-80 server for its own domain, so without this block
# a request for ruirufactorymabati.com would fall through to it as the default
# server and be redirected to fibicommunity.org.
#
# Kept in a separate file from the HTTPS block on purpose: nginx refuses to start
# when a server block names a certificate that is not on disk, and this block is
# what answers the ACME challenge that produces that certificate. This proxy also
# fronts fibicommunity.org, visionmentors.org and draftbitlabs.tech — a missing
# file in the HTTPS block would take down three unrelated sites.
#
# Upstreams are addressed by the alias set in docker-compose.prod.yml, never by
# the bare service name: Docker's embedded DNS answers a name with every
# container carrying it, and several stacks share this network (infora_web
# already answers to `web`).

upstream mabati_web {
    server mabati-web:80;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name ruirufactorymabati.com www.ruirufactorymabati.com;

    # Must stay on plain HTTP and must never redirect: Let's Encrypt validates
    # over port 80, and renewal happens when the current certificate is close to
    # expiry — exactly when a redirect to a soon-to-be-invalid certificate would
    # break it. Shares the webroot volume the certbot container writes into.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
