# Mabati — origin server, plain HTTP on port 80.
#
# This container is NOT internet-facing. The shared FIBI edge proxy
# (fibi-proxy-1, /opt/fibi/FIBI) owns ports 80/443 on this host, terminates TLS
# for ruirufactorymabati.com and proxies here over the internal Docker network.
# So there is deliberately no TLS, no HTTP->HTTPS redirect and no certificate
# path in this file: duplicating any of that here would either fight the edge
# proxy or fail to start when the certificate is not mounted.
#
# Inherited from the edge proxy, not repeated here:
#   Host / X-Real-IP / X-Forwarded-For / X-Forwarded-Proto
#   HSTS and the other security headers
#   TLS parameters (deploy/ssl-params.conf in the FIBI stack)

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Lets the edge proxy and `docker inspect` tell "container is up" apart from
    # "container is serving", without pulling in the SPA fallback below.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite fingerprints these filenames, so a long immutable TTL is safe: a
    # changed asset is a changed URL. Must come before the SPA fallback, or a
    # missing asset would be answered with index.html and a 200.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html itself must never be cached, or browsers keep loading the old
    # bundle's asset URLs after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing: unknown paths are React Router's, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
